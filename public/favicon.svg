<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient: Azul Meia-Noite -->
    <radialGradient id="midnightBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1c2541" />
      <stop offset="60%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#050a17" />
    </radialGradient>

    <!-- Leaf / Body Gradient: Azul Claro / Sky Blue -->
    <linearGradient id="skyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle Badge -->
  <rect width="100" height="100" rx="22" fill="url(#midnightBg)" />
  <rect width="96" height="96" x="2" y="2" rx="20" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Wellness Human Figure & Leaves Emblem -->
  <g filter="url(#softGlow)">
    <!-- 1. Central Head -->
    <circle cx="50" cy="31" r="5" fill="url(#skyGrad)" />

    <!-- 2. Torso / Central Stem Lines -->
    <path 
      d="M 46.5 78 L 46.5 62 C 46.5 50 48.5 44 44 38" 
      fill="none" 
      stroke="url(#skyGrad)" 
      stroke-width="3" 
      stroke-linecap="round" 
    />
    <path 
      d="M 53.5 78 L 53.5 62 C 53.5 50 51.5 44 56 38" 
      fill="none" 
      stroke="url(#skyGrad)" 
      stroke-width="3" 
      stroke-linecap="round" 
    />

    <!-- 3. Left Inner Leaf -->
    <path 
      d="M 46 64 C 36 60 25 48 30 24 C 42 28 48 46 46 64 Z" 
      fill="url(#skyGrad)" 
    />
    <!-- Left Leaf Vein -->
    <path 
      d="M 44 60 C 39 48 35 36 31 26" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="1.5" 
      stroke-linecap="round" 
      stroke-opacity="0.85" 
    />

    <!-- 4. Right Inner Leaf -->
    <path 
      d="M 54 64 C 64 60 75 48 70 24 C 58 28 52 46 54 64 Z" 
      fill="url(#skyGrad)" 
    />
    <!-- Right Leaf Vein -->
    <path 
      d="M 56 60 C 61 48 65 36 69 26" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="1.5" 
      stroke-linecap="round" 
      stroke-opacity="0.85" 
    />

    <!-- 5. Left Outer Sweeping Wing / Leaf -->
    <path 
      d="M 44 68 C 30 64 18 54 10 44 C 18 48 32 58 44 68 Z" 
      fill="url(#skyGrad)" 
    />

    <!-- 6. Right Outer Sweeping Wing / Leaf -->
    <path 
      d="M 56 68 C 70 64 82 54 90 44 C 82 48 68 58 56 68 Z" 
      fill="url(#skyGrad)" 
    />
  </g>
</svg>