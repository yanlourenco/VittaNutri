<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient: Midnight Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#070d1e" />
    </linearGradient>

    <!-- Stroke Gradient: Wellness Teal to Sky Blue -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#00b4d8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect width="116" height="116" x="2" y="2" rx="26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Wellness 3-Leaf Botanical Logo -->
  <g 
    filter="url(#softGlow)" 
    fill="none" 
    stroke="url(#leafGrad)" 
    stroke-width="3.8" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  >
    <!-- Central Vertical Stem -->
    <line x1="60" y1="50" x2="60" y2="70" stroke-width="4.2" />

    <!-- Top Vertical Leaf -->
    <path d="M 60 50 C 48 38 48 22 60 12 C 72 22 72 38 60 50 Z" />
    <!-- Top Leaf Vein -->
    <line x1="60" y1="48" x2="60" y2="20" stroke-width="3" />

    <!-- Left Tilted Leaf -->
    <path d="M 60 50 C 46 44 34 36 30 28 C 32 44 44 58 60 50 Z" />
    <!-- Left Leaf Vein -->
    <path d="M 60 50 C 50 44 42 38 36 32" stroke-width="3" />

    <!-- Right Tilted Leaf -->
    <path d="M 60 50 C 74 44 86 36 90 28 C 88 44 76 58 60 50 Z" />
    <!-- Right Leaf Vein -->
    <path d="M 60 50 C 70 44 78 38 84 32" stroke-width="3" />
  </g>

  <!-- Company Name Typography Under Icon -->
  <text 
    x="60" 
    y="93" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-size="16" 
    font-weight="800" 
    letter-spacing="2.2" 
    font-family="Outfit, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  >
    VITTA
  </text>
  
  <text 
    x="60" 
    y="108" 
    text-anchor="middle" 
    fill="#38bdf8" 
    font-size="9" 
    font-weight="700" 
    letter-spacing="3" 
    font-family="Outfit, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  >
    NUTRI
  </text>
</svg>