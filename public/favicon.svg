<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Midnight Blue -->
    <linearGradient id="vittaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0a1128" />
    </linearGradient>

    <!-- Leaf / Vitality Gradient: Sky Blue to Emerald Cyan -->
    <linearGradient id="vitalityGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle Badge -->
  <rect width="64" height="64" rx="16" fill="url(#vittaBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Stylized Vitta "V" & Nutritional Vitality Leaf -->
  <g filter="url(#glow)">
    <!-- Right Leaf Curve of the V -->
    <path 
      d="M32 50 C36 42 48 32 50 18 C38 18 30 28 32 50 Z" 
      fill="url(#vitalityGrad)" 
    />
    
    <!-- Left Dynamic Stroke of the V -->
    <path 
      d="M14 20 C18 20 28 34 32 50 C29 38 23 26 14 20 Z" 
      fill="url(#accentGrad)" 
    />

    <!-- Central Vitality Pulse Node / Spark -->
    <circle cx="32" cy="22" r="3.5" fill="#38bdf8" />
    <circle cx="32" cy="22" r="1.5" fill="#ffffff" />
  </g>
</svg>